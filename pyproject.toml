[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxotag"
version = "0.1.0"
description = "Python port of Desert Ant Labs' Gist on-device topic tagger"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "huggingface_hub>=0.20", "model2vec>=0.3"]

[project.optional-dependencies]
litert = [
    "ai-edge-litert",
]
tensorflow = ["tensorflow"]
dev = ["build", "mypy", "pytest", "pytest-cov", "ruff", "twine"]

[project.scripts]
taxotag = "taxotag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taxotag"]

[tool.uv]
package = true
