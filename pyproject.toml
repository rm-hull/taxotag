[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxotag"
version = "0.1.2"
description = "Python port of Desert Ant Labs' Gist on-device topic tagger"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "huggingface_hub>=0.20", "model2vec>=0.3"]

[project.optional-dependencies]
litert = ["ai-edge-litert"]
tensorflow = ["tensorflow"]
dev = ["build", "mypy", "pytest", "pytest-cov", "ruff", "twine"]

[project.scripts]
taxotag = "taxotag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taxotag"]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = ["slow: model-backed tests that require the downloaded TFLite assets"]

[dependency-groups]
dev = [
    "python-semantic-release>=10.6,<11",
    "uv==0.12.17",
]

[tool.semantic_release]
allow_zero_version = true
build_command = """
python -m pip install "uv==0.12.17"
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
uv build
"""
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.remote]
token = { env = "GH_TOKEN" }
